//
// Build time only module: turns the cheat sheet markdown into a PDF.
// The PDF rendering stack (flexmark-pdf-converter, openhtmltopdf, PDFBox) is
// deliberately kept out of the application runtime and lives here only.
//

dependencies {
    implementation 'com.vladsch.flexmark:flexmark-all:' + versionFlexmarkAll
}

def cheatSheetMarkdown = rootProject.file('docs/cheat-sheet.md')
def cheatSheetCss = rootProject.file('docs/cheat-sheet.css')
def cheatSheetPdf = layout.buildDirectory.file('cheat-sheet/JTaccuino-CheatSheet.pdf')

tasks.register('pdf', JavaExec) {
    group = 'documentation'
    description = 'Render docs/cheat-sheet.md to a PDF'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.jtaccuino.cheatsheet.CheatSheetGenerator'
    inputs.files cheatSheetMarkdown, cheatSheetCss
    outputs.file cheatSheetPdf
    args cheatSheetMarkdown.absolutePath,
        cheatSheetCss.absolutePath,
        cheatSheetPdf.get().asFile.absolutePath
}
