name: Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-14, macos-15, macos-26, ubuntu-latest, windows-latest ]
        include:
          - os: macos-14
            ARCH: "-aarch64"
            PLAT: "macos"
          - os: macos-15
            ARCH: "-aarch64"
            PLAT: "macos"
          - os: macos-26
            ARCH: "-aarch64"
            PLAT: "macos"
          - os: ubuntu-latest
            ARCH: ""
            PLAT: "linux"
          - os: windows-latest
            ARCH: ""
            PLAT: "win"
    runs-on: ${{ matrix.os }}
    steps:

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install at-spi2-core build-essential libgtk-3-dev libxtst-dev libavcodec-dev libavformat-dev libasound2-dev libgl-dev
          
      - uses: actions/checkout@v7

      - name: Read properties from app gradle.properties
        id: app-gradle-props
        uses: kurt-code/gha-properties@v0.0.2
        with:
          operation: 'read'
          file-path: 'app/gradle.properties'
          keys: 'additional_jdk_modules, app_version'

      - name: Read version from root gradle.properties
        id: root-gradle-props
        uses: kurt-code/gha-properties@v0.0.2
        with:
          operation: 'read'
          file-path: 'gradle.properties'
          keys: 'version'

      - name: Setup Java 26
        id: java26
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 26

      - name: Setup Java 27 (toolchain)
        id: java27
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 27
          set-default: false

      - uses: Apple-Actions/import-codesign-certs@v7
        if: github.event_name != 'pull_request' && matrix.os == 'macos-14'
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.CERTIFICATES_PASSWORD }}

      - name: Build project
        run: ./gradlew -i build -x test
        
      - name: Run Tests
        run: |
          ./gradlew -i test

      - name: Setup Java 24 for jpackage
        id: java24-jpackage
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 24
          set-default: false

      - name: Setup Java 27 for jdeps/jlink
        id: java27-jpackage
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 27

      - name: Setup JPackage Home
        id: jpackage
        run: |
          echo JPACKAGE_HOME=${{ steps.java24-jpackage.outputs.path }} >> $GITHUB_OUTPUT

      - name: Create Bundle using jpackage for macos
        if: matrix.os == 'macos-14'
        id: outputfile_mac
        run: |
          if [[ ${{ github.event_name }} != 'pull_request' ]]; then
          .github/scripts/build_app_mac.sh \
            --mac-package-signing-prefix "${{ env.MACSIGN_PREFIX }}" \
            --mac-signing-key-user-name "${{ env.MACSIGN_USER }}" \
            --mac-sign
          else
            .github/scripts/build_app_mac.sh
          fi
          ls target/installer
          mv target/installer/JTaccuinoStudio-${{ steps.app-gradle-props.outputs.app_version }}.pkg target/installer/JTaccuinoStudio-${{ steps.app-gradle-props.outputs.app_version }}${{ matrix.ARCH }}.pkg
          echo path=target/installer/JTaccuinoStudio-${{ steps.app-gradle-props.outputs.app_version }}${{ matrix.ARCH }}.pkg >> $GITHUB_OUTPUT
        env:
          MACSIGN_PREFIX: ${{ secrets.GLUON_MACSIGN_PREFIX }}
          MACSIGN_USER: ${{ secrets.GLUON_MACSIGN_USER }}
          JPACKAGE_HOME: ${{ steps.jpackage.outputs.JPACKAGE_HOME }}
          VERSION: ${{ steps.root-gradle-props.outputs.version }}
          APP_VERSION: ${{ steps.app-gradle-props.outputs.app_version }}
          ADDITIONAL_JDK_MODULES: ${{ steps.app-gradle-props.outputs.additional_jdk_modules }}          

      - name: Create Bundle using jpackage for linux
        if: matrix.os == 'ubuntu-latest'
        id: outputfile_linux
        run: |
          .github/scripts/build_app_linux.sh \
            --type deb
          echo path_deb=target/installer/jtaccuinostudio_${{ steps.app-gradle-props.outputs.app_version }}-0_amd64.deb >> $GITHUB_OUTPUT
          .github/scripts/build_app_linux.sh \
            --type rpm
          echo path_rpm=target/installer/jtaccuinostudio-${{ steps.app-gradle-props.outputs.app_version }}-0.x86_64.rpm >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.root-gradle-props.outputs.version }}
          APP_VERSION: ${{ steps.app-gradle-props.outputs.app_version }}
          ADDITIONAL_JDK_MODULES: ${{ steps.app-gradle-props.outputs.additional_jdk_modules }}          

      - name: Create Bundle using jpackage for windows
        if: matrix.os == 'windows-latest'
        id: outputfile_win
        shell: cmd
        run: |
          call .github\scripts\build_app_windows.bat
          echo path=target\installer\JTaccuinoStudio-${{ steps.app-gradle-props.outputs.app_version }}.msi >> %GITHUB_OUTPUT%
        env:
          VERSION: ${{ steps.root-gradle-props.outputs.version }}
          APP_VERSION: ${{ steps.app-gradle-props.outputs.app_version }}
          ADDITIONAL_JDK_MODULES: ${{ steps.app-gradle-props.outputs.additional_jdk_modules }}                    

      - name: Notarize Release Build
        id: notarize
        if: github.event_name != 'pull_request' && matrix.os == 'macos-14'
        uses: erwin1/xcode-notarizer@v1
        with:
          product-path: ${{ steps.outputfile_mac.outputs.path }}
          apple-id: ${{ secrets.NOTARIZATION_USERNAME }}
          app-password: ${{ secrets.NOTARIZATION_PASSWORD }}
          team-id: ${{ secrets.GLUON_MACSIGN_PREFIX }}

      # erwin1/xcode-notarizer only reports the generic "Processing complete" on
      # rejection and does not expose the submission id, so a rejected build
      # gives no reason. Retry once with notarytool directly: if the rejection
      # was transient the retry is accepted and we staple and carry on, and
      # otherwise the submission log with the offending binaries is printed.
      - name: Notarize retry and log
        if: failure() && steps.notarize.outcome == 'failure'
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.GLUON_MACSIGN_PREFIX }}
          PKG: ${{ steps.outputfile_mac.outputs.path }}
        run: |
          set -uo pipefail
          result=$(mktemp)
          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --output-format json --wait --no-progress | tee "$result"
          id=$(python3 -c "import json; print(json.load(open('$result'))['id'])")
          status=$(python3 -c "import json; print(json.load(open('$result'))['status'])")
          if [ "$status" = "Accepted" ]; then
            echo "Notarization accepted on retry, stapling."
            xcrun stapler staple "$PKG"
            exit 0
          fi
          echo "::error::Notarization rejected, see the notary log below"
          xcrun notarytool log "$id" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID"
          exit 1

      - name: Archive jpackage for macos
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v7
        with:
          name: JTaccuinoStudio-${{ matrix.PLAT }}${{ matrix.ARCH }}
          path: ${{ steps.outputfile_mac.outputs.path }}

      - name: Archive jpackage for linux deb
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: JTaccuinoStudio-${{ matrix.PLAT }}${{ matrix.ARCH }}-deb
          path: ${{ steps.outputfile_linux.outputs.path_deb }}

      - name: Archive jpackage for linux rpm
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: JTaccuinoStudio-${{ matrix.PLAT }}${{ matrix.ARCH }}-rpm
          path: ${{ steps.outputfile_linux.outputs.path_rpm }}

      - name: Archive jpackage for windows
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: JTaccuinoStudio-${{ matrix.PLAT }}${{ matrix.ARCH }}
          path: ${{ steps.outputfile_win.outputs.path }}
