configurations {
    javafx {
        description = 'Java FX libraries'
    }
    implementation {
        extendsFrom configurations.javafx
    }
    runtime {
        extendsFrom configurations.javafx
    }
}

dependencies {
    javafx 'org.openjfx:javafx-base:' + versionJavafx + ':' + rootProject.javaFxPlatform
    javafx 'org.openjfx:javafx-graphics:' + versionJavafx + ':' + rootProject.javaFxPlatform
    javafx 'org.openjfx:javafx-fxml:' + versionJavafx + ':' + rootProject.javaFxPlatform
    javafx 'org.openjfx:javafx-controls:' + versionJavafx+':' + rootProject.javaFxPlatform
    javafx 'org.openjfx:javafx-media:' + versionJavafx+':' + rootProject.javaFxPlatform
    javafx 'org.openjfx:javafx-web:' + versionJavafx + ':' + rootProject.javaFxPlatform
    javafx 'org.openjfx:javafx-swing:' + versionJavafx + ':' + rootProject.javaFxPlatform
    javafx 'org.openjfx:jfx-incubator-richtext:' + versionJfxIncubatorRichtext + ':' + rootProject.javaFxPlatform
    javafx 'org.openjfx:jfx-incubator-input:' + versionJfxIncubatorInput + ':' + rootProject.javaFxPlatform

    implementation 'com.gluonhq.emoji:emoji:' + versionGluonhqEmoji
    implementation('com.vladsch.flexmark:flexmark-all:' + versionFlexmarkAll) {
        // The PDF rendering stack (openhtmltopdf, PDFBox) is only used at build
        // time by the cheatsheet module and must not ship with the application.
        exclude group: 'com.vladsch.flexmark', module: 'flexmark-pdf-converter'
    }

    implementation 'jakarta.json:jakarta.json-api:' + versionJakartaJsonApi
    implementation 'jakarta.json.bind:jakarta.json.bind-api:' + versionJakartaJsonBindApi

    runtimeOnly 'org.eclipse:yasson:' + versionYasson

    implementation project(':shell')
}
