# Single project version for every module. Publishing needs one coordinate set
# across the artifacts, and a module that published a different version from
# another would make the transitive dependencies unresolvable. Override with
# -Pversion=... or a release tag.
version=27.0.0-SNAPSHOT
# Maven group for the published artifacts. GitHub Packages forces
# com.github.<owner>.<repo>; override with -Pgroup=... for that target.
group=org.jtaccuino

versionJavafx=27
versionJfxIncubatorRichtext=27
versionJfxIncubatorInput=27
versionYasson=3.0.5
versionMavenResolver=2.0.23
versionMaven=3.9.16
versionOsMavenPlugin=1.7.1
versionJupiter=5.10.2
versionJakartaJsonBindApi=3.0.3
versionJakartaJsonApi=2.1.3
versionFlexmarkAll=0.64.8
versionGluonhqEmoji=1.1.0
